name: Backend CI

# devops_environments.md, "CI/CD Pipeline" — path-filtered so a frontend-only change never
# triggers this. Paths here are relative to src/, which is this repository's own root once it's
# extracted to become the real repo — see project_architecture.md's Repository Structure.
# Inert until then: the workflow file is correct and ready, it just isn't running yet.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit + integration tests
        run: dotnet test --no-build --configuration Release
        # testing_strategy.md: integration tests use Testcontainers.PostgreSql, which needs
        # Docker — available by default on GitHub-hosted ubuntu-latest runners.

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes
