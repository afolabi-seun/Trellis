# Local Postgres for development (devops_environments.md, "Environments" — Local uses
# docker-compose Postgres with seeded fake data). Not used by Development/Staging/Production,
# which run against the chosen PaaS's managed Postgres add-on.
services:
  postgres:
    image: postgres:16
    container_name: trellis-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: trellis_platform
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis_dev_only
    ports:
      - "5432:5432"
    volumes:
      - trellis_postgres_data:/var/lib/postgresql/data
      # Runs once, on first container init only — creates the unprivileged trellis_app role the
      # running API connects as, so RLS actually applies (see that file's own comment).
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/init-app-role.sql:ro

volumes:
  trellis_postgres_data:
